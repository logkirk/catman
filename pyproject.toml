[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catman"
version = "0.1.0"
description = "CLI game management tool for Cataclysm"
requires-python = ">=3.11"
dependencies = [
    "cmd2>=2.5.0",
    "simple-term-menu>=1.6.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "rich>=13.0.0",
]

[project.scripts]
catman = "catman.__main__:main"
